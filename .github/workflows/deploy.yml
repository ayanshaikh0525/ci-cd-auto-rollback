name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        cd app
        docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-demo:latest .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/devops-demo:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        script: |

          docker pull ${{ secrets.DOCKER_USERNAME }}/devops-demo:latest

          docker tag \
          ${{ secrets.DOCKER_USERNAME }}/devops-demo:latest \
          ${{ secrets.DOCKER_USERNAME }}/devops-demo:previous || true

          docker stop app || true
          docker rm app || true

          docker run -d \
            -p 80:3000 \
            --name app \
            ${{ secrets.DOCKER_USERNAME }}/devops-demo:latest

          sleep 10

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health)

          if [ "$STATUS" != "200" ]; then

            echo "Deployment failed. Rolling back..."

            docker stop app || true
            docker rm app || true

            docker run -d \
              -p 80:3000 \
              --name app \
              ${{ secrets.DOCKER_USERNAME }}/devops-demo:previous

            echo "Rollback has done to previous stable version."
            
            exit 1
          fi

          echo "Deployment successful!"